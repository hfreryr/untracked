# Lieux par tuile, reconstruits chaque nuit depuis l'extrait OSM d'Île-de-France (openstreetmap.fr, mis à jour vers 01:30 UTC ;
# Paris seulement jusqu'au 23/10/2026)
# et publiés dans data/places/ du site (branche gh-pages), sans toucher au reste.
name: Lieux par tuile (nuit)
on:
  schedule:
    - cron: '45 2 * * *'
    # Secours : GitHub ne garantit pas l'heure des lancements programmés (retard de plusieurs heures ou lancement
    # sauté, constaté les 14 et 15/10/2026). Ce second lancement ne recalcule rien si les données du jour existent déjà.
    - cron: '15 5 * * *'
  workflow_dispatch:
concurrency:
  group: places
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Déjà fait aujourd'hui ? (lancements programmés seulement)"
        id: fresh
        run: |
          built=$(curl -sSf https://untrackedmaps.app/data/places/index.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('built','')[:10])" || true)
          echo "données en ligne du : $built"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$built" = "$(date -u +%F)" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "déjà à jour, rien à faire"; fi
      - if: steps.fresh.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (désigné par empreinte : un outil tiers modifié ne passerait pas)
        with: { ref: main }
      - if: steps.fresh.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - if: steps.fresh.outputs.skip != 'true'
        run: pip install osmium==4.3.1
      - if: steps.fresh.outputs.skip != 'true'
        name: Extrait OSM d'Île-de-France (somme de contrôle vérifiée)
        # OSM France, et Geofabrik en secours si OSM France ne répond pas (panne du 25/10/2026)
        run: bash app/scripts/fetch_idf.sh idf.osm.pbf
      - if: steps.fresh.outputs.skip != 'true'
        run: |
          curl -sSfL -o facades.json https://untrackedmaps.app/data/facades.json || echo '{}' > facades.json
          curl -sSfL -o extras.json https://untrackedmaps.app/data/extras.json || echo '{}' > extras.json
      - if: steps.fresh.outputs.skip != 'true'
        name: Avis libres Mangrove (une seule demande pour toute la région ; sans avis si Mangrove ne répond pas)
        run: python app/scripts/fetch_reviews.py --bbox 1.44,48.12,3.56,49.24 --out reviews.json || echo '[]' > reviews.json
      - if: steps.fresh.outputs.skip != 'true'
        run: python app/scripts/build_places.py idf.osm.pbf --out out/places --facades facades.json --extras extras.json --reviews reviews.json
      - if: steps.fresh.outputs.skip != 'true'
        name: Réseau cyclable (carte vélo) — bandes, voies bus, double-sens, pistes
        run: python app/scripts/build_bikes.py idf.osm.pbf --out out
      - if: steps.fresh.outputs.skip != 'true'
        name: Index de recherche (recherche sur le téléphone, notoriété QRank lue dans extras.json)
        run: python app/scripts/build_search.py out/places --extras extras.json
      - if: steps.fresh.outputs.skip != 'true'
        name: "Garde-fou : si l'extrait paraît tronqué ou vide, on ne publie pas"
        run: python -c "import json,sys; i=json.load(open('out/places/index.json')); n=len(i['tiles']); print(n,'tuiles'); sys.exit(0 if n >= 2000 else 1)"
      - if: steps.fresh.outputs.skip != 'true'
        name: "Garde-fou : pas de publication si les lieux ou les tuiles baissent de plus de 10 % par rapport à la version en ligne"
        run: python app/scripts/check_publish.py out/places/index.json
      - if: steps.fresh.outputs.skip != 'true'
        name: Publier dans gh-pages/data/places
        run: |
          git fetch --depth=1 origin gh-pages
          git worktree add pages origin/gh-pages
          rm -rf pages/data/places && mkdir -p pages/data && cp -r out/places pages/data/places
          # réseau cyclable : publié seulement s'il paraît complet (sinon on garde celui de la veille)
          if python -c "import json,sys; n=len(json.load(open('out/bikes.geojson'))['features']); print(n,'voies cyclables à Paris'); sys.exit(0 if n >= 5000 else 1)"; then
            rm -rf pages/data/bikes && cp -r out/bikes pages/data/bikes && cp out/bikes.geojson pages/data/bikes.geojson
          else echo "réseau cyclable non publié"; fi
          bash app/scripts/site_budget.sh pages   # plafond de poids du site (700 Mo), voir docs/villes.md
          cd pages && git add -A data/places && { [ ! -d data/bikes ] || git add -A data/bikes data/bikes.geojson; }
          git -c user.name=untracked-bot -c user.email=bot@untrackedmaps.app commit -qm "Lieux par tuile et réseau cyclable : extrait OSM du $(date -u +%F)" || exit 0
          git push origin HEAD:gh-pages
