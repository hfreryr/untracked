# Tests automatiques à chaque proposition de changement et à chaque envoi sur main :
# tests unitaires de l'app (sans réseau), construction du site, tests du pipeline.
# (Les tests de bout en bout appellent les vrais services : ils se lancent à la main, npm run e2e.)
name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '22' }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - run: npm audit --audit-level=high      # échoue si une dépendance a une faille grave connue
      - run: npm test
      - run: npm run check             # aucun nom utilisé sans être défini
      - run: npm run build
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install rapidfuzz pytest pyyaml osmium==4.3.1 shapely==2.2.0
      - name: Fichiers des actions GitHub lisibles (un YAML invalide arrête le calcul de nuit sans prévenir)
        run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('ok')"
      - run: python -m pytest -q pipeline/tests app/scripts/tests
