# Lieux par tuile des villes hors Île-de-France (app/src/lib/cities/zones.json), une fois par semaine chacune :
# chaque ville a son jour (« day » : 1 = lundi … 7 = dimanche), pour étaler les calculs et les publications
# (porteur, 30/10/2026 : plus de villes, mises à jour moins fréquentes, sobriété).
# Extrait de la région ou du département (openstreetmap.fr, somme de contrôle vérifiée), réduit au cadre de la zone,
# publié dans data/zones/<ville>/places/ du site, sans toucher au reste ; puis l'annuaire national (data/directory/). Même garde-fou que la nuit (-10 %).
# Avec les avis Mangrove et les compléments hors OSM (Overture, All The Places, annuaire), source affichée dans la fiche.
name: Lieux des régions et autres villes (hebdomadaire)
on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
    inputs:
      zone:
        description: "Ville à refaire tout de suite (ex. lyon), ou « toutes »"
        required: true
        default: toutes
      sites:
        description: "Sites des lieux à lire par zone (4000 par semaine ; jusqu'à 25000 pour le premier rattrapage d'UNE zone)"
        required: true
        default: '4000'
concurrency:
  group: places          # jamais en même temps que la publication de nuit ni le ménage de l'historique
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { ref: main }
      - name: Villes du jour
        id: due
        env:
          WANTED: ${{ inputs.zone }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, datetime
          zones = json.load(open("app/src/lib/cities/zones.json"))
          w = os.environ.get("WANTED") or ""
          today = datetime.datetime.utcnow().isoweekday()
          due = zones if w == "toutes" else [z for z in zones if z["id"] == w] if w else [z for z in zones if z["day"] == today]
          print("zones=" + " ".join(f'{z["id"]}:{z["extract"]}:{",".join(map(str, z["bbox"]))}:{z["country"]}' for z in due))
          PY
          cat "$GITHUB_OUTPUT"
      - if: steps.due.outputs.zones != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: '3.12' }
      - if: steps.due.outputs.zones != ''
        run: pip install osmium==4.3.1 duckdb==1.5.6 shapely==2.2.0 pillow==12.3.0   # pillow : photos des avis (review_photos.py)
      - if: steps.due.outputs.zones != ''
        name: Construire, contrôler et publier
        env:
          ZONES: ${{ steps.due.outputs.zones }}
          SITES: ${{ inputs.sites }}   # vide la nuit (programmé) : 4000
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          git worktree add pages origin/gh-pages
          for spec in $ZONES; do
            IFS=: read -r id extract bbox country <<< "$spec"
            echo "::group::$id"
            IDF_SOURCES="https://download.openstreetmap.fr/extracts/$extract.osm.pbf" bash app/scripts/fetch_idf.sh "$id.osm.pbf"
            python app/scripts/fetch_reviews.py --bbox="$bbox" --out "$id-reviews.json" || echo '[]' > "$id-reviews.json"
            # compléments hors OSM (sites, téléphones, adresses, horaires d'enseignes) : Overture, All The Places, annuaire de
            # l'administration, comme à Paris (build_extras.py) ; All The Places téléchargé une seule fois par passage
            python app/scripts/build_extras.py "$id.osm.pbf" --out "$id-extras.json" --no-paris --pays "$country" $([ -f atp.zip ] && echo --atp atp.zip) \
              || { echo "::error::$id : compléments hors OSM non calculés"; partial=1; echo '{"places":{}}' > "$id-extras.json"; }
            # horaires et photo publiés par le site des lieux, comme en Île-de-France (porteur, 01/11/2026) ; état de la zone
            # gardé d'une semaine à l'autre dans data/zones/<zone>/sitehours.json ; une panne ici ne bloque pas la zone
            # (états jamais remplacés par un état vide si le site ne répond pas : fetch_state.sh, 06/11/2026)
            centre=$(python3 -c "b=[float(x) for x in '$bbox'.split(',')]; print(f'{(b[0]+b[2])/2},{(b[1]+b[3])/2}')")
            if bash app/scripts/fetch_state.sh "https://untrackedmaps.app/data/zones/$id/sitehours.json" "$id-sitehours.json"; then
              python app/scripts/build_sitehours.py "$id.osm.pbf" --extras "$id-extras.json" --state "$id-sitehours.json" \
                --max-new "${SITES:-4000}" --centre="$centre" || { echo "::error::$id : sites des lieux non lus"; partial=1; }
            else partial=1; fi
            # photos Wikimedia préparées à l'avance (build_wikiphotos.py) ; état gardé dans data/zones/<zone>/wikiphotos.json
            if bash app/scripts/fetch_state.sh "https://untrackedmaps.app/data/zones/$id/wikiphotos.json" "$id-wikiphotos.json"; then
              python app/scripts/build_wikiphotos.py "$id.osm.pbf" --extras "$id-extras.json" --state "$id-wikiphotos.json" \
                || { echo "::error::$id : photos Wikimedia non préparées"; partial=1; }
            else partial=1; fi
            python app/scripts/build_places.py "$id.osm.pbf" --out "out/$id" --bbox="$bbox" --reviews "$id-reviews.json" --extras "$id-extras.json"
            python app/scripts/build_landmarks.py "$id.osm.pbf" --out "out/$id" --bbox="$bbox"   # lieux mis en avant sur la carte
            python app/scripts/build_search.py "out/$id" --extras "$id-extras.json"   # recherche sur le téléphone
            # contrôle avant publication : lieux, tuiles et chaque champ (horaires, photos…), comparés à la version en ligne
            if python app/scripts/check_publish.py "out/$id/index.json" "https://untrackedmaps.app/data/zones/$id/places/index.json" | tee "$id-verdict.txt"; then
              rm -rf "pages/data/zones/$id/places" && mkdir -p "pages/data/zones/$id" && cp -r "out/$id" "pages/data/zones/$id/places"
              [ -f "$id-sitehours.json" ] && cp "$id-sitehours.json" "pages/data/zones/$id/sitehours.json"
              [ -f "$id-wikiphotos.json" ] && cp "$id-wikiphotos.json" "pages/data/zones/$id/wikiphotos.json"
              echo "- **$id** : publiée — $(cat "$id-verdict.txt")" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$id non publiée (baisse anormale) : la version en ligne reste"; failed=1
              echo "- **$id** : NON publiée — $(cat "$id-verdict.txt")" >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$id.osm.pbf"
            echo "::endgroup::"
          done
          # zones retirées de zones.json (ex. Lyon, remplacée par la région Rhône-Alpes) : leurs tuiles quittent le site
          for d in pages/data/zones/*/; do
            [ -d "$d" ] || continue; z=$(basename "$d")
            python3 -c "import json,sys; sys.exit(0 if '$z' in [x['id'] for x in json.load(open('app/src/lib/cities/zones.json'))] else 1)" \
              || { echo "zone retirée : $z"; rm -rf "$d"; }
          done
          # annuaire national des lieux par nom (toutes les régions publiées, Île-de-France comprise) : refait à chaque passage
          python app/scripts/build_directory.py pages/data || { echo "::error::annuaire national non refait"; partial=1; }
          bash app/scripts/site_budget.sh pages   # plafond de poids du site (700 Mo), voir docs/villes.md
          cd pages && git add -A data/zones data/directory
          if git -c user.name=untracked-bot -c user.email=bot@untrackedmaps.app commit -qm "Lieux des villes ($ZONES) : extraits OSM du $(date -u +%F)"; then
            bash ../app/scripts/push_pages.sh   # réessaie si gh-pages a avancé ; échoue bruyamment sinon (04/11/2026)
          else echo "rien de nouveau"; fi
          # une zone non publiée ou une étape ratée : calcul en rouge, même si le reste est publié (06/11/2026)
          [ -z "${failed:-}" ] && [ -z "${partial:-}" ]
