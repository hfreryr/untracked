# Contrôle quotidien de la production (06/11/2026, après l'incident des données) : ce que le site sert vraiment, zone
# par zone (âge, fichiers, champs à zéro), les services extérieurs sur le fond (Wikimedia, recherche, transports…) et
# l'état des derniers calculs. Problème → un signalement GitHub « Contrôle des données » (le porteur reçoit un mail),
# mis à jour chaque jour tant que ça dure, fermé tout seul quand tout est rentré dans l'ordre.
# Aucune donnée d'utilisateur : des lectures du site public et des requêtes fixes.
name: Contrôle des données (quotidien)
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: '3.12' }
      - name: Contrôle
        id: c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python app/scripts/health_check.py --report rapport.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat rapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Signalement (ouvert, mis à jour ou fermé)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.c.outputs.code }}
        run: |
          gh label create controle --color B60205 --description "Contrôle quotidien des données" 2>/dev/null || true
          n=$(gh issue list --label controle --state open --json number --jq '.[0].number')
          if [ "$CODE" != "0" ]; then
            if [ -n "$n" ]; then gh issue comment "$n" --body-file rapport.md
            else gh issue create --title "Contrôle des données : problème(s) à corriger" --label controle --body-file rapport.md; fi
            exit 1
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Tout est rentré dans l'ordre : $(date -u +%F)."
          fi
