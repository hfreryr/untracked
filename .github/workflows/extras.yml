# Compléments hors OSM (sites, téléphones…) tirés de sources ouvertes, chaque semaine ; publiés dans data/extras.json du site.
# La construction nocturne des lieux (places.yml) les lit depuis le site et les ajoute aux tuiles, avec leur source.
# Sources et licences : docs/sources-donnees.md. Rien de ce fichier n'est envoyé dans OSM.
name: Compléments des lieux (hebdo)
on:
  schedule:
    - cron: '40 3 * * 1'
  workflow_dispatch:
concurrency:
  group: extras
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (désigné par empreinte : un outil tiers modifié ne passerait pas)
        with: { ref: main }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: '3.12' }
      - run: pip install osmium==4.3.1 duckdb==1.5.6 pillow==12.3.0   # pillow : taille des photos des sites (build_sitehours.py)
      - name: Extrait OSM d'Île-de-France (somme de contrôle vérifiée ; Paris seulement jusqu'au 23/10/2026)
        # OSM France, et Geofabrik en secours si OSM France ne répond pas (panne du 25/10/2026)
        run: bash app/scripts/fetch_idf.sh idf.osm.pbf
      # mesuré le 23/10 en local : 41 600 lieux complétés (Overture, All The Places, annuaire) en 18 min
      - run: python app/scripts/build_extras.py idf.osm.pbf --out out/extras.json
      - name: Horaires et photo publiés par les sites des lieux (Common Crawl d'abord, visites espacées, robots.txt respecté)
        run: |
          curl -sSfL -o out/sitehours.json https://untrackedmaps.app/data/sitehours.json || echo '{}' > out/sitehours.json
          python app/scripts/build_sitehours.py idf.osm.pbf --extras out/extras.json --state out/sitehours.json --max-new 4000 || echo "sites ignorés (le reste est publié)"
      - name: "Garde-fou : pas de publication si les compléments paraissent vides"
        run: python -c "import json,sys; n=len(json.load(open('out/extras.json'))['places']); print(n,'lieux complétés'); sys.exit(0 if n >= 1000 else 1)"
      - name: Publier dans gh-pages/data/extras.json
        run: |
          git fetch --depth=1 origin gh-pages
          git worktree add pages origin/gh-pages
          mkdir -p pages/data && cp out/extras.json pages/data/extras.json && cp out/sitehours.json pages/data/sitehours.json
          cd pages && git add -A data/extras.json data/sitehours.json
          git -c user.name=untracked-bot -c user.email=bot@untrackedmaps.app commit -qm "Compléments des lieux du $(date -u +%F)" || exit 0
          git push origin HEAD:gh-pages
